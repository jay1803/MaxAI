name: check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Public-safety check
        env:
          PRIVATE_TERMS: ${{ secrets.PRIVATE_TERMS }}
        run: python3 scripts/check_public.py
      - name: List indentation check
        run: python3 scripts/check_lists.py
      - name: Build site
        run: |
          pip install -r requirements.txt
          mkdocs build --strict
